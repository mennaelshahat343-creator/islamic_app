name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Clear Java Options
        run: |
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          unset JAVA_OPTS
          java -version

      - name: Build APK
        run: |
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          unset JAVA_OPTS
          flutter clean
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
