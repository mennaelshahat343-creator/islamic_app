name: islamic_app
description: A comprehensive Islamic application for Android and iOS

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Sensors
  geolocator: ^10.1.0
  flutter_compass: ^0.7.0
  sensors_plus: ^3.1.0

  # Prayer Times (local calculation fallback - not wired by default;
  # the app uses api.aladhan.com as the primary live source, see prayer_service.dart)
  adhan: ^2.0.0+1

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.13

  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # UI
  # ملاحظة: نستخدم google_fonts بدل تضمين ملفات خطوط محلية، لأن ملفات
  # Amiri/Cairo/Scheherazade الفعلية غير مرفقة بهذا المشروع. إن رغبت باستخدام
  # خطوط محلية بدلًا من ذلك، ضع ملفات .ttf الحقيقية في assets/fonts/ وأعد
  # تفعيل قسم "fonts:" أسفل هذا الملف، ثم احذف اعتماد google_fonts.
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # Utils
  http: ^1.1.2
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  vibration: ^1.8.4
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2

  # Compass & Qibla math
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # ملاحظة: نُدرج مجلد assets/audio/ كاملًا بدل تحديد ملف adhan.mp3 بعينه،
  # لأن الملف الصوتي الفعلي غير مرفق بالمشروع. أضف ملف الأذان الخاص بك إلى
  # assets/audio/adhan.mp3 (احترم حقوق الاستخدام لأي تسجيل صوتي تستخدمه).
  assets:
    - assets/images/
    - assets/data/
    - assets/audio/

  # قسم الخطوط المحلية معطّل حاليًا (راجع الملاحظة أعلاه بخصوص google_fonts).
  # fonts:
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf
  #       - asset: assets/fonts/Amiri-Bold.ttf
  #         weight: 700
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
